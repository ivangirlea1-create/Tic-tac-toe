<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <div class="game-card">
      <h1>Tic Tac Toe</h1>
      <p class="subtitle">Schönes Tic-Tac-Toe für CodePen</p>

      <div class="top-bar">
        <div class="score-box x-box">
          <span class="label">Spieler X</span>
          <span class="value" id="scoreX">0</span>
        </div>

        <div class="score-box draw-box">
          <span class="label">Unentschieden</span>
          <span class="value" id="scoreDraw">0</span>
        </div>

        <div class="score-box o-box">
          <span class="label">Spieler O</span>
          <span class="value" id="scoreO">0</span>
        </div>
      </div>

      <div id="status" class="status">❌ ist dran</div>

      <div class="board" id="board">
        <button class="cell" data-index="0"></button>
        <button class="cell" data-index="1"></button>
        <button class="cell" data-index="2"></button>
        <button class="cell" data-index="3"></button>
        <button class="cell" data-index="4"></button>
        <button class="cell" data-index="5"></button>
        <button class="cell" data-index="6"></button>
        <button class="cell" data-index="7"></button>
        <button class="cell" data-index="8"></button>
      </div>

      <div class="buttons">
        <button id="restartBtn" class="primary-btn">Neue Runde</button>
        <button id="resetScoreBtn" class="secondary-btn">Punkte löschen</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
